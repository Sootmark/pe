[package]
name = "sootmark-pe"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows Portable Executable (PE) metadata for forensics: compile time, type, sections, imports, exports, import hash, version information, PDB path, resource and debug time stamps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/pe"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "windows", "pe", "imphash"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "pe"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
